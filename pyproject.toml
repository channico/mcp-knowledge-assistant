[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-knowledge-assistant"
version = "0.1.0"
description = "A portfolio-ready MCP server with read-only search and fetch tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.7",
    "openai>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcp-knowledge-assistant = "mcp_knowledge_assistant.server:main"
mcp-vector-store-assistant = "mcp_knowledge_assistant.vector_store_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_knowledge_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
